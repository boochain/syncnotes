name: syncnotes
description: "SyncNotes - 多设备同步笔记"
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.12.2

dependencies:
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.9
  desktop_drop: ^0.8.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
