name: syncnotes
description: "SyncNotes - 多设备实时同步笔记/消息"
publish_to: 'none'
version: 0.6.13+20

environment:
  sdk: ^3.12.2

dependencies:
  characters: ^1.4.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2
  flutter_markdown_plus: ^1.0.12
  http: ^1.6.0
  multicast_dns: ^0.3.3+1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  tray_manager: ^0.5.3
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  url_launcher: ^6.3.3
  liquid_glass_widgets: 1.13.0
  cupertino_icons: ^1.0.9
  archive: ^4.5.2
  desktop_drop: ^0.8.0
  cross_file: ^0.3.5+5
  cryptography: ^2.7.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
