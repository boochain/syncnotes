name: Build & Test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"
  CARGO_TERM_COLOR: always

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: server
        run: cargo test --all-targets
      - name: Build release binary (for app e2e)
        working-directory: server
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: server-bin-for-e2e
          path: server/target/release/syncnotes-server
          retention-days: 3

  app-test:
    name: App analyze & tests
    needs: server-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: server-bin-for-e2e
          path: bin
      - run: chmod +x bin/syncnotes-server
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test (unit + widget + e2e against real server)
        working-directory: app
        env:
          SYNCNOTES_SERVER_BIN: ${{ github.workspace }}/bin/syncnotes-server
        run: flutter test
      - name: Test date math under a DST timezone
        working-directory: app
        env:
          TZ: America/New_York
        run: flutter test test/civil_date_dst_test.dart test/calendar_test.dart


  web-test:
    name: Web client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, test, build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: End-to-end (real server + Chromium)
        run: |
          (cd server && cargo build --release)
          cd web
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14
      - name: Package static site (release asset)
        run: |
          VER="${GITHUB_REF_NAME}"
          case "$VER" in v*) ;; *) VER="v$(node -p "require('./web/package.json').version")" ;; esac
          mkdir -p web-pkg/syncnotes-web
          cp -r web/dist/. web-pkg/syncnotes-web/
          rm -f web-pkg/syncnotes-web/assets/*.map
          cp web/README.md web-pkg/syncnotes-web/README-web.md
          cp -r web/deploy web-pkg/syncnotes-web/deploy
          (cd web-pkg && zip -qr "SyncNotes-web-${VER}.zip" syncnotes-web)
          ls -l web-pkg
      - uses: actions/upload-artifact@v4
        with:
          name: app-web
          path: web-pkg/*.zip

  server-build:
    name: Server ${{ matrix.name }}
    needs: server-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ""
            cross: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        working-directory: server
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          # 打包：二进制 + README + 部署配置，Linux 用 .tar.gz（保留可执行权限），Windows 用 .zip
          PKG=syncnotes-server-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.name }}
          mkdir -p ../dist ../pkg/$PKG
          cp target/${{ matrix.target }}/release/syncnotes-server${{ matrix.ext }} ../pkg/$PKG/
          cp ../README.md ../LICENSE ../pkg/$PKG/
          cp -r ../deploy ../pkg/$PKG/deploy
          if [ -z "${{ matrix.ext }}" ]; then
            # Linux 包附带一键管理脚本与救援脚本
            cp ../scripts/syncnotes-server.sh ../scripts/syncnotes-rescue.sh ../pkg/$PKG/
            chmod +x ../pkg/$PKG/syncnotes-server.sh ../pkg/$PKG/syncnotes-rescue.sh
          else
            # Windows 包附带 PowerShell 一键管理脚本
            cp ../scripts/syncnotes-server.ps1 ../pkg/$PKG/
          fi
          cd ../pkg
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a -tzip ../dist/$PKG.zip $PKG >/dev/null
            7z l ../dist/$PKG.zip
          else
            chmod +x $PKG/syncnotes-server
            tar -czf ../dist/$PKG.tar.gz $PKG
            tar -tvzf ../dist/$PKG.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: dist/*

  app-linux:
    name: App Linux
    needs: app-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - name: Package
        run: |
          bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: dist/*

  app-windows:
    name: App Windows
    needs: app-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/*

  app-android:
    name: App Android
    needs: app-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 仓库里有一把固定的正式密钥，保证每次安装包签名相同。
          # 如果以后配了 Actions secret，用 secret 覆盖，仓库里的密钥就不再参与打包。
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/syncnotes-release.p12"
            echo "SYNCNOTES_KEYSTORE=$RUNNER_TEMP/syncnotes-release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: app
        env:
          SYNCNOTES_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SYNCNOTES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SYNCNOTES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Package
        run: |
          bash scripts/package-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-build, app-linux, app-windows, app-android, web-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{server-linux-*,server-windows-*,app-*}"
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            NOTES_FILE=docs/release-notes/${TAG}.md
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" artifacts/* --title "SyncNotes $TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" artifacts/* --title "SyncNotes $TAG" --generate-notes
            fi
          fi
